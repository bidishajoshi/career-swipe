{% extends "base.html" %}
{% block title %}Seeker Login – CareerSwipe{% endblock %}

{% block content %}

<div class="auth-wrap auth-login-wrap seeker-theme">
    <div class="auth-card auth-login-card">

```
    <div class="auth-header">
        <span class="role-badge badge-seeker">🔵 Job Seeker</span>
        <h2>Welcome back</h2>
        <p>Sign in to your account to find your next opportunity</p>
    </div>

    <form method="POST" class="auth-form" id="loginSeekerForm">

        <div class="field">
            <label for="login-email">Email address</label>
            <input
                type="email"
                id="login-email"
                name="email"
                required
                autofocus
                placeholder="you@example.com">
        </div>

        <div class="field">
            <label for="login-password">Password</label>

            <div style="position:relative;">
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    required
                    placeholder="••••••••"
                    style="padding-right:50px;">

                <span
                    id="toggleEye"
                    onclick="togglePassword()"
                    style="
                        position:absolute;
                        right:15px;
                        top:50%;
                        transform:translateY(-50%);
                        cursor:pointer;
                        user-select:none;
                        font-size:20px;
                    ">
                    🙈
                </span>
            </div>
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-full"
            style="margin-top:0.5rem;">
            Sign In →
        </button>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register_seeker') }}">
                Create one free
            </a>
        </p>

        <p class="auth-link" style="margin-top:0.5rem;">
            A company?
            <a href="{{ url_for('login_company') }}"
               style="color:var(--accent);">
                Company Login
            </a>
        </p>

    </form>

</div>
```

</div>

<script>
function togglePassword() {
    const password = document.getElementById("login-password");
    const icon = document.getElementById("toggleEye");

    if (password.type === "password") {
        password.type = "text";
        icon.textContent = "🐵";
    } else {
        password.type = "password";
        icon.textContent = "🙈";
    }
}
</script>

{% endblock %}
